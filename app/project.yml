name: RathiFitness
options:
  bundleIdPrefix: com.rathi
  deploymentTarget:
    # 17.2, not 17.0: Meta's glasses SDK raised its floor in the release this
    # project pins (see `packages`, below) and an app targeting anything older
    # can no longer link it.
    iOS: "17.2"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Same team the RIA faces sign with. Automatic signing plus
    # -allowProvisioningUpdates creates the App ID, the profile and the
    # iCloud container on first device build.
    DEVELOPMENT_TEAM: DCCFA8MX7A
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # The glasses, in Developer Mode: "MetaAppID = 0" needs no project in Meta's
    # developer centre and no client token. There is no other mode on offer —
    # Meta has no route yet for shipping a display app to glasses that are not
    # in Developer Mode.
    META_APP_ID: "0"
    CLIENT_TOKEN: ""
    SWIFT_EMIT_LOC_STRINGS: "YES"

# BELOW `settings`, and that is load-bearing: the `version-sync` guard reads the
# FIRST x.y.z in this file as the app's version. With this block at the top it
# read the SDK's pin and failed the build saying the app was "0.9.0". Keep
# MARKETING_VERSION the first version-shaped string in the file — in comments too.
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    # Exact, never a range. 0.7 -> 0.8 -> 0.9 each removed or renamed public
    # API inside three months; a range is an unattended build break.
    exactVersion: 0.9.0

targets:
  RathiFitness:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: RathiFitness
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rathi.fitness
        PRODUCT_MODULE_NAME: RathiFitness
        INFOPLIST_FILE: RathiFitness/Info.plist
        CODE_SIGN_ENTITLEMENTS: RathiFitness/RathiFitness.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"

  RathiFitnessTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rathi.fitness.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: RathiFitness
      # For `import MWDATDisplay` in LensTests. Linked, not embedded: the host
      # app already carries the framework, and a second copy in the test bundle
      # is two of every class at runtime.
      - package: MetaWearablesDAT
        product: MWDATDisplay
        embed: false

  RathiFitnessUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rathi.fitness.uitests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: RathiFitness

schemes:
  RathiFitness:
    build:
      targets:
        RathiFitness: all
        RathiFitnessTests: [test]
        RathiFitnessUITests: [test]
    test:
      targets:
        # Serial. The whole unit bundle is ~2.5 SECONDS of testing, so there is
        # nothing for a second worker to do.
        - name: RathiFitnessTests
          parallelizable: false
        # Parallel. This bundle is ~7 of the suite's 8 minutes, and XCTest
        # parallelises by CLASS — which is why WritePathUITests is five
        # classes rather than one (see app/UITests/WritePathCase.swift).
        - name: RathiFitnessUITests
          parallelizable: true
