name: RathiFitness
options:
  bundleIdPrefix: com.rathi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Same team the RIA faces sign with. Automatic signing plus
    # -allowProvisioningUpdates creates the App ID, the profile and the
    # iCloud container on first device build.
    DEVELOPMENT_TEAM: DCCFA8MX7A
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:
  RathiFitness:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RathiFitness
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rathi.fitness
        PRODUCT_MODULE_NAME: RathiFitness
        INFOPLIST_FILE: RathiFitness/Info.plist
        CODE_SIGN_ENTITLEMENTS: RathiFitness/RathiFitness.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"

  RathiFitnessTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rathi.fitness.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: RathiFitness

  RathiFitnessUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rathi.fitness.uitests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: RathiFitness

schemes:
  RathiFitness:
    build:
      targets:
        RathiFitness: all
        RathiFitnessTests: [test]
        RathiFitnessUITests: [test]
    test:
      targets:
        # Serial. The whole unit bundle is ~2.5 SECONDS of testing, so there is
        # nothing for a second worker to do.
        - name: RathiFitnessTests
          parallelizable: false
        # Parallel. This bundle is ~7 of the suite's 8 minutes, and XCTest
        # parallelises by CLASS — which is why WritePathUITests is five
        # classes rather than one (see app/UITests/WritePathCase.swift).
        - name: RathiFitnessUITests
          parallelizable: true
