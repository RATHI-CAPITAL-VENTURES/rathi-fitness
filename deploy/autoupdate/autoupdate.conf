# Project facts for autoupdate.sh. The spine beside this file is shared and
# comes from RIA's templates/autoupdate; everything here is this project's.

AU_REPO="$HOME/RIA/projects/rathi-fitness"
AU_LOG="$HOME/Library/Logs/rathi-fitness/autoupdate.log"
AU_APPLY="$AU_REPO/deploy/autoupdate/apply.d/ios.sh"

# ---------------------------------------------------------------- iOS hook
# THE TWO IDs ARE DIFFERENT AND NOT INTERCHANGEABLE:
#   ECID    -> xcodebuild -showdestinations -project RathiFitness.xcodeproj -scheme RathiFitness
#   DEVICE  -> xcrun devicectl list devices          (CoreDevice UUID)
# Both are Ishan's iPhone 14 Pro.
AU_IOS_PROJECT="RathiFitness.xcodeproj"
AU_IOS_SCHEME="RathiFitness"
AU_IOS_ECID="00008120-000C70441AE2201E"
AU_IOS_DEVICE="861545F5-1AB5-53A8-91C7-E956FDF93FD4"
# The executable path devicectl prints, NOT the bundle id (com.rathi.fitness) —
# a bundle id never appears in `devicectl device info processes`, which is how
# this guard shipped once unable to fire at all.
AU_IOS_APP_PROCESS="/RathiFitness.app/"
# `xcode-select -p` on this Mac is CommandLineTools, which cannot build an iOS
# app at all — it fails with "tool 'xcodebuild' requires Xcode".
AU_IOS_DEVELOPER_DIR="/Applications/Xcode-beta.app/Contents/Developer"
