# Guard configuration for rathi-fitness. Sourced by guards.sh — plain bash.
#
# Facts about THIS project only. Anything that is a judgement about how to ship
# belongs in guards.sh, where every project gets it; anything that is a rule
# only this project has belongs in guards.d/.

# ---------------------------------------------------------------------------
# Layout — the repo IS the app, but the app is two languages: a SwiftUI iPhone
# app under app/ and a Python CLI under cli/ that reads what it writes.
# ---------------------------------------------------------------------------

APP="."
APP_PREFIX="$(app_prefix "$APP")"

VERSION_FILE="VERSION"
VERSION_FIELDS=3

# `MARKETING_VERSION` in project.yml is what the phone shows in Settings, and
# `Bundle.appVersion` stamps it into every snapshot the Mac reads. If it drifts
# from VERSION then `gym status` reports a version that was never released.
# There is no exempt label for this on purpose: they agree or one of them lies.
VERSION_MIRRORS="app/project.yml"

CHANGELOG="CHANGELOG.md"
CHANGELOG_ARCHIVE_DIR="docs/changelog"
CHANGELOG_ARCHIVE_CMD="make changelog-archive"

RETRO_DIR="docs/retros"

# ---------------------------------------------------------------------------
# What counts as what
# ---------------------------------------------------------------------------

# Capability code. The app's own source and the CLI that reads its snapshot —
# a change to either is something a person can observe, so it owes a doc.
# Tests and the Xcode project are excluded: neither is a capability.
DOCS_CODE_PATTERN="^(app/RathiFitness/.*\.swift|cli/gym)$"
DOCS_TARGET_PATTERN="^(docs/.*\.md|README\.md|CLAUDE\.md)$"
DOCS_HINT="  - the snapshot's shape changed -> docs/SNAPSHOT.md
  - a decision, or one you rejected  -> docs/DECISIONS.md
  - anything a person can now do     -> README.md"

# Wider than the docs pattern on purpose: the icon renderer and the design
# system are logic worth testing but not user-visible capability.
TESTS_CODE_PATTERN="^(app/RathiFitness/.*\.swift|cli/gym|design/make_icon\.py)$"
TESTS_TARGET_PATTERN="^(app/(Tests|UITests)/.*\.swift|cli/test_gym\.py)$"

# A new screen or a new model is capability-shaped, and a PATCH claiming
# otherwise should be challenged. Structural, never diff size — a size
# threshold fires on refactors that change nothing and teaches people to
# ignore the guard.
CAPABILITY_ADD_PATTERN="^app/RathiFitness/(Views|Model)/[^/]+\.swift$"

# ---------------------------------------------------------------------------
# Policy
# ---------------------------------------------------------------------------

RETRO_DEBT_MAX=8
PR_TITLE_TYPES="feat|fix|docs|refactor|perf|test|chore|build|ci|revert|design"

# The app has no autonomous self-ship, so every PR here is opened by a human or
# by an agent that can add a label. Labels only would be stricter — but the
# agent working in this repo commits with `[skip x]` tags and cannot label a PR
# it has not opened yet, which is the same hole RIA left open for the same
# reason.
ALLOW_COMMIT_TAGS=1

# ---------------------------------------------------------------------------
# Scope — which expensive jobs a diff justifies.
#
# `swift` is the one that matters: macOS runners bill at 10x on a private repo,
# so a docs-only PR must not spend five minutes of them.
# ---------------------------------------------------------------------------
SCOPE_RULES="swift:^app/
cli:^cli/
icon:^design/make_icon\.py$
ci_config:^\.github/"
