name: ci

# Build and test. The cheap structural checks live in `guards.yml`, which comes
# from the shared template and is upgraded by `bootstrap` — keeping the two
# apart means an upgrade never clobbers this file.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Which expensive jobs does this diff justify?
  #
  # Worth its own 20-second ubuntu job because the job it gates costs macOS
  # minutes, which bill at 10x on a private repo. A docs-only change must not
  # spend five of them.
  scope:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.scope.outputs.swift }}
      cli: ${{ steps.scope.outputs.cli }}
      ci_config: ${{ steps.scope.outputs.ci_config }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        env:
          # A PR diffs against its merge base. A push diffs against what was
          # there before it — and `github.event.before` is all-zeroes for the
          # first push to a new branch, where the whole tree is the change.
          BASE_SHA: ${{ github.event_name == 'pull_request'
                        && github.event.pull_request.base.sha
                        || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base — treating everything as changed"
            echo "swift=true"     >> "$GITHUB_OUTPUT"
            echo "cli=true"       >> "$GITHUB_OUTPUT"
            echo "ci_config=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" bash .github/scripts/guards.sh scope

  # The CLI. Cheap, fast, and the half of the snapshot contract that can be
  # tested without a simulator — so it runs on its own rather than waiting
  # behind a macOS queue.
  # This project's own guards get their own tests, for the same reason the
  # template's do: a guard that fails for the right reason with the wrong
  # message is one people learn to ignore. Kept out of guards.yml because
  # `bootstrap` replaces that file on every template upgrade.
  project-guards:
    runs-on: ubuntu-latest
    needs: [scope]
    if: always() && needs.scope.outputs.ci_config == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/guards.d.test.sh

  cli:
    runs-on: ubuntu-latest
    needs: [scope]
    if: always() && needs.scope.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gym CLI tests
        run: python3 -m unittest discover cli -v

  swift:
    runs-on: macos-15
    needs: [scope]
    # `always()` because `scope` can be skipped, and a skipped dependency would
    # otherwise take this job down with it.
    if: always() && needs.scope.outputs.swift == 'true'
    steps:
      - uses: actions/checkout@v4

      # The IMAGE is the pin — `macos-15` — and its default Xcode is used as-is.
      # Selecting an Xcode by path pairs its SDK with an image whose simulator
      # RUNTIMES were installed separately, and `actool` refuses the mismatch.
      # The default toolchain and the image's runtimes are consistent by
      # construction, which is a stronger guarantee than a hand-picked string.
      - name: Report the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -10

      # The Xcode project is generated, not committed — `.gitignore` excludes
      # `*.xcodeproj/`, so without this there is nothing to build.
      - name: Generate the project
        run: |
          brew install xcodegen
          cd app && xcodegen generate

      # `make`, not a hand-rolled xcodebuild, so CI and a developer's machine run
      # the SAME invocations. Only the destination and toolchain are overridden,
      # because those genuinely differ from a Mac — everything else lives in the
      # Makefile, where it can be read in one place.
      #
      # One destination, chosen by NAME so the image can move its device IDs
      # without breaking us. `CODE_SIGNING_ALLOWED=NO` (in the Makefile) is what
      # makes this possible at all: signing would need the Apple Development
      # identity and its provisioning profile on the runner, and an
      # iCloud/HealthKit credential does not belong in CI. A simulator needs
      # neither and catches the same breakage.
      #
      # Two steps rather than one `make test` so a unit failure reports early
      # rather than behind the UI bundle.
      #
      # PARALLEL=NO, measured rather than assumed. A macos runner has about three
      # cores; with three simulator clones the UI step ALONE took 19:26, against
      # a whole job — build included — of about 16:00 before this change. The
      # same parallelism on a ten-core Mac takes the suite from 7:54 to 5:39.
      # It is a fact about the machine, so the machine says.
      - name: Unit tests
        run: |
          set -euo pipefail
          make test-unit \
            DEVELOPER_DIR="$(xcode-select -p)" \
            SIMULATOR='platform=iOS Simulator,name=iPhone 16,OS=latest'

      - name: UI tests
        run: |
          set -euo pipefail
          make test-ui \
            DEVELOPER_DIR="$(xcode-select -p)" \
            SIMULATOR='platform=iOS Simulator,name=iPhone 16,OS=latest' \
            PARALLEL=NO
